<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HNB Finance</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mu:#5d6570;--bd:#d9dde3;--ac:#1f5fd1;--ok:#13794a;--okb:#e3f6ec;--bad:#c0262d;--badb:#fde8e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101215;--card:#1a1d22;--tx:#eceef1;--mu:#9aa3ae;--bd:#2f353d;--ac:#6ea0ff;--ok:#4cd18b;--okb:#12301f;--bad:#ff7076;--badb:#3a1618}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101215;--card:#1a1d22;--tx:#eceef1;--mu:#9aa3ae;--bd:#2f353d;--ac:#6ea0ff;--ok:#4cd18b;--okb:#12301f;--bad:#ff7076;--badb:#3a1618}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
.w{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.r{display:flex;gap:8px}.r>div{flex:1}
.ck{display:flex;align-items:center;gap:10px;margin:10px 0 0;font-size:15px}
.ck input{width:22px;height:22px;flex:none}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:15px}
.row b{font-variant-numeric:tabular-nums}
.box{border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.ok{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}
.big{font-size:26px;font-weight:700;color:var(--ac);text-align:center;margin:6px 0}
.sm{text-align:center;color:var(--mu);font-size:13px}
input.err{border-color:var(--bad);background:var(--badb);color:var(--bad)}
input.good{border-color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0;margin-bottom:6px}
.top h1{margin:0}
.mb{font-size:24px;line-height:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:44px;height:44px}
.menu{display:none;position:absolute;right:0;top:54px;background:var(--card);border:1px solid var(--bd);border-radius:12px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:15px 16px;font-size:16px;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx)}
.btn{width:100%;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.bar{display:none}
@media(max-width:640px){.w{padding-bottom:96px}.bar{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}.bar .t{flex:1;min-width:0}.bar .t small{display:block;color:var(--mu);font-size:12px}.bar .t b{font-size:18px;color:var(--ac)}.bar .btn{width:auto;padding:12px 18px}}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}.md{width:100%;max-width:420px;margin:0}.md h2{margin:0 0 4px;font-size:18px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="w">
<div class="top" style="position:sticky">
  <h1>🏍️ HNB Finance</h1>
  <button class="mb" id="mb" aria-label="Menu">☰</button>
  <div class="menu" id="menu">
    <button id="m-pdf">📄 Save as PDF</button>
    <button id="m-theme">🌓 Dark / Light</button>
    <button id="m-reset">🔄 Reset</button>
  </div>
</div>

<div class="c">
  <div class="ck"><input type="checkbox" id="bn" checked><label for="bn" style="margin:0;color:inherit">Brand New Bike</label></div>
  <label>Make</label>
  <select id="make"></select>
  <label>Model</label>
  <select id="model"></select>
  <div class="row"><span>NEW INVOICE</span><b id="inv">–</b></div>
  <div class="row"><span>Normal Price</span><b id="price">–</b></div>
  <div class="row"><span>Max LTV (Max Exposure)</span><b id="ltv">–</b></div>
  <div class="box ok" id="mindp">Minimum Down Payment: –</div>

  <label>Down Payment (Rs.)</label>
  <input type="number" inputmode="decimal" id="dp" placeholder="Enter down payment">
  <div class="box bad" id="dpmsg" style="display:none"></div>
</div>

<div class="c">
  <div class="ck"><input type="checkbox" id="pro" checked><label for="pro" style="margin:0;color:inherit">Pro. Offer</label></div>
  <div class="r"><div><label>Pro. Offer Amount</label><input type="number" inputmode="decimal" id="proa" value="6000"></div></div>
  <div class="ck"><input type="checkbox" id="rmv"><label for="rmv" style="margin:0;color:inherit">RMV</label></div>
  <label>RMV Amount</label><input type="number" inputmode="decimal" id="rmva" value="0">
  <label>Insurance Amount * <span style="color:var(--ok)">(auto-filled if in price list – otherwise enter manually)</span></label><input type="number" inputmode="decimal" id="ins" placeholder="Required">
  <div class="box bad" id="insmsg" style="display:none;margin-top:6px">Insurance Amount is required</div>
  <label id="intrl">Introducer Commission (Max 4% of New Invoice)</label><input type="number" inputmode="decimal" id="intr" value="0" min="0">
  <div class="box bad" id="intrmsg" style="display:none;margin-top:6px"></div>
</div>

<div class="c">
  <div class="r">
    <div><label>Rate (% per year)</label><input type="number" inputmode="decimal" id="rate" value="23" step="0.01"></div>
  </div>
  <div class="r">
    <div><label>Tenure – Years</label><select id="yr"></select></div>
    <div><label>Months</label><select id="mo"></select></div>
  </div>
</div>

<div class="c">
  <div class="row"><span>Price − Down Payment</span><b id="r1">–</b></div>
  <div class="row"><span>+ Pro. Offer</span><b id="r2">–</b></div>
  <div class="row"><span>+ Insurance</span><b id="r3">–</b></div>
  <div class="row"><span>+ Introducer Commission</span><b id="r4">–</b></div>
  <div class="row"><span>+ RMV</span><b id="r5">–</b></div>
  <div class="row"><span><b>Leasing Amount</b></span><b id="la">–</b></div>
  <div class="sm" style="margin-top:12px">Monthly Installment</div>
  <div class="big" id="inst">–</div>
  <div class="sm" id="tot"></div>
</div>

</div>

<div class="bar"><div class="t"><small>Monthly Installment</small><b id="bi">–</b></div><button class="btn" id="b-pdf">📄 Save PDF</button></div>

<div class="ov" id="ov"><div class="c md">
  <h2>Save as PDF</h2>
  <label>Customer Name *</label><input type="text" id="cn" autocomplete="name">
  <label>NIC *</label><input type="text" id="cnic" maxlength="12" autocapitalize="characters" placeholder="e.g. 199012345678 or 901234567V">
  <div class="box bad" id="cerr" style="display:none"></div>
  <div class="r" style="margin-top:14px"><div><button class="btn sec" id="cx">Cancel</button></div><div><button class="btn" id="cs">Save PDF</button></div></div>
</div></div>

];
// NEW INVOICE values, same order as MODELS
const INV=[1207900,1260900,1445900,1496900,1872900,2098900,2152900,2257900,2589900,2896900,1342900,1413900,1499000,1235900,1235900,1282000,1112900,1253900,730900,1607900,1712900,1971900,1502900,1056900,3974900,4038000,2627900,1024500,1268900,1261900,1461900,1372900,1605900,899950,710950,799950,739950,1154950,440950,1248900,1097900,1395900,1048000,1198000,650000,650000,540000,420000,1195000,760000,1298000,880000,610000,1015000,1140900,659950,759950,856950,699950,855950,794950,974950,999950,1164950,1299950,2339950,1489950,1834950,2799950,524900,439900,769900,384900,349900,574900,690000,740000,790000,840000,770000,715000,274500,449500,839500,859500,399500,449500,344500,899900,699900,519500,695000,1090000,617000,699000,800000,950000,730000,920000,890000,229900,389900];
// Insurance premium per model, same order as MODELS (from price list)
const PINS=[22932,23596,26029,26709,31628,34585,35301,36672,41004,45014,24514,25433,26584,23131,null,23728,21540,23364,16600,27942,29299,32649,47014,35206,58554,59371,41134,20479,23727,23636,26248,25084,28136,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null];
// ==================================================================
const $=id=>document.getElementById(id);
const f=n=>"Rs. "+(Math.round(n*100)/100).toLocaleString("en-LK",{minimumFractionDigits:2,maximumFractionDigits:2});
const v=id=>parseFloat($(id).value)||0;
[...new Set(MODELS.map(m=>m[0]))].sort((x,y)=>(y==="TVS")-(x==="TVS")).forEach(k=>$("make").add(new Option(k,k)));
const BAJAJ_RMV=10160;
function rmvRule(){
  const bj=$("make").value==="BAJAJ";
  if(bj){$("rmv").checked=true;$("rmv").disabled=true;if(!(v("rmva")>0))$("rmva").value=BAJAJ_RMV}
  else{if($("rmv").disabled){$("rmv").checked=false;$("rmva").value=0}$("rmv").disabled=false}
}
function fillModels(){const s=$("model");s.innerHTML="";MODELS.forEach((m,i)=>{if(m[0]===$("make").value)s.add(new Option(m[1],i))});rmvRule();setIns();}
function setIns(){const p=PINS[$("model").value];$("ins").value=p==null?"":p;calc()}
fillModels();
$("make").addEventListener("input",fillModels);
$("model").addEventListener("input",setIns);

for(let y=1;y<=7;y++)$("yr").add(new Option(y+" yr",y));
for(let m=1;m<=11;m++)$("mo").add(new Option(m+" mo",m));
function calc(){
  const m=MODELS[$("model").value],price=m[2],maxLoan=m[3];
  const ltv=maxLoan/price*100;
  const minDp=m[4];
  $("price").textContent=f(price);$("inv").textContent=f(INV[$("model").value]);$("ltv").textContent=f(maxLoan);
  $("mindp").textContent="Minimum Down Payment: "+f(minDp);
  const dpEmpty=$("dp").value==="";
  const dp=v("dp");
  const low=!dpEmpty&&dp<minDp;
  $("dp").classList.toggle("err",low);$("dp").classList.toggle("good",!dpEmpty&&!low);
  $("mindp").className="box "+(low?"bad":"ok");
  const msg=$("dpmsg");msg.style.display=low?"block":"none";
  if(low)msg.textContent="Down payment is "+f(minDp-dp)+" short of the minimum (max exposure exceeded)";
  const base=Math.max(price-dp,0);
  const pro=$("pro").checked?v("proa"):0;
  const rmv=$("rmv").checked?v("rmva"):0;
  const maxIntr=Math.floor(INV[$("model").value]*0.04*100)/100;
  $("intrl").textContent="Introducer Commission (Max 4% of New Invoice = "+f(maxIntr)+")";
  $("intr").max=maxIntr;
  const im=$("intrmsg");
  if(v("intr")>maxIntr){$("intr").value=maxIntr;im.textContent="Introducer Commission limited to 4% of New Invoice ("+f(maxIntr)+")";im.style.display="block"}
  else{im.style.display="none"}
  if(v("intr")<0)$("intr").value=0;
  const ins=v("ins"),intr=v("intr");
  const insMiss=!(ins>0);
  $("insmsg").style.display=insMiss?"block":"none";
  const L=base+pro+ins+intr+rmv;
  $("r1").textContent=f(base);$("r2").textContent=f(pro);$("r3").textContent=f(ins);
  $("r4").textContent=f(intr);$("r5").textContent=f(rmv);$("la").textContent=f(L);
  const n=v("yr")*12+v("mo");
  const rate=v("rate")/100;
  let pay=0;
  if(n>0&&L>0){
    const i=rate/12;pay=i===0?L/n:L*i/(1-Math.pow(1+i,-n));
  }
  $("inst").textContent=insMiss?"Enter Insurance Amount":n>0?f(pay):"Select tenure";
  $("bi").textContent=$("inst").textContent;
  window.R={m,price,inv:INV[$("model").value],bn:$("bn").checked,dp,base,pro,ins,intr,rmv,L,rate:v("rate"),yr:v("yr"),mo:v("mo"),n,pay,insMiss};
  $("tot").textContent=n>0&&L>0?n+" months × "+f(pay)+" = "+f(pay*n):"";
}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",calc));
calc();

// ===== Menu =====
const closeMenu=()=>$("menu").classList.remove("open");
$("mb").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("open")};
document.addEventListener("click",e=>{if(!$("menu").contains(e.target))closeMenu()});
$("m-theme").onclick=()=>{closeMenu();const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
$("m-reset").onclick=()=>{closeMenu();if(confirm("Reset all fields?"))location.reload()};

// ===== Save as PDF =====
function openSave(){
  closeMenu();calc();const R=window.R;
  if(R.insMiss){alert("Please enter the Insurance Amount.");$("ins").focus();return}
  if(R.m[0]==="BAJAJ"&&!(R.rmv>0)){alert("RMV amount is required for BAJAJ.");$("rmva").focus();return}
  if(R.n<=0){alert("Please select the tenure.");return}
  $("cerr").style.display="none";$("ov").classList.add("open");$("cn").focus();
}
$("m-pdf").onclick=openSave;$("b-pdf").onclick=openSave;
$("cx").onclick=()=>$("ov").classList.remove("open");
$("cs").onclick=()=>{
  const name=$("cn").value.trim(),nic=$("cnic").value.trim().toUpperCase(),er=$("cerr");
  let msg="";
  if(!name)msg="Customer Name is required";
  else if(!/^(\d{9}[VX]|\d{12})$/.test(nic))msg="Enter a valid NIC (12 digits, or 9 digits + V/X)";
  if(msg){er.textContent=msg;er.style.display="block";return}
  if(!window.jspdf){er.textContent="PDF library could not load. Check your internet connection and try again.";er.style.display="block";return}
  makePDF(name,nic);$("ov").classList.remove("open");
};
function makePDF(name,nic){
  const R=window.R,d=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const L=18,E=192;let y=20;
  d.setFont("helvetica","bold");d.setFontSize(18);d.text("HNB Finance - Leasing Quotation",L,y);y+=7;
  d.setFont("helvetica","normal");d.setFontSize(10);d.text("Date: "+new Date().toLocaleDateString("en-GB"),L,y);y+=10;
  const sec=t=>{d.setFont("helvetica","bold");d.setFontSize(12);d.text(t,L,y);y+=2;d.line(L,y,E,y);y+=7;d.setFont("helvetica","normal");d.setFontSize(11)};
  const row=(a,b,bold)=>{d.setFont("helvetica",bold?"bold":"normal");d.text(a,L,y);d.text(String(b),E,y,{align:"right"});y+=7};
  sec("Customer");row("Customer Name",name);row("NIC",nic);y+=4;
  sec("Vehicle");row("Make",R.m[0]);row("Model",R.m[1]);row("Condition",R.bn?"Brand New":"Used");
  row("New Invoice",f(R.inv));row("Normal Price",f(R.price));y+=4;
  sec("Leasing Details");
  row("Down Payment",f(R.dp));row("Price - Down Payment",f(R.base));
  if(R.pro)row("+ Pro. Offer",f(R.pro));
  row("+ Insurance",f(R.ins));row("+ Introducer Commission",f(R.intr));
  if(R.rmv)row("+ RMV",f(R.rmv));
  row("Leasing Amount",f(R.L),true);y+=4;
  sec("Installment");
  row("Rate (per year)",R.rate+"%");
  row("Tenure",(R.yr?R.yr+" yr ":"")+(R.mo?R.mo+" mo":"")+" ("+R.n+" months)");
  row("Monthly Installment",f(R.pay),true);
  row("Total Payable",f(R.pay*R.n));
  d.save((name+"_"+nic).replace(/[^A-Za-z0-9]+/g,"_")+".pdf");
}
</script>
